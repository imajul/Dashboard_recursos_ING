<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capacidad de Ingeniería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra de herramientas + franja de KPIs; debajo, una sola línea de tiempo mensual
   compartida por el Gantt de proyectos, la matriz de ocupación y el gráfico demanda/capacidad;
   editor lateral contextual a la derecha; chips de filtro en el pie. */
:root{
  --paper:#ffffff;
  --ink:#15201a;
  --ink-soft:#5b6b62;
  --rule:#c9d2cc;
  --rule-soft:#e5eae7;
  --band:#22351f;
  --band-ink:#f2f5f0;
  --band-2:#dfe4e0;
  --band-3:#eef1ee;
  --surface:#f4f6f4;
  --chip:#ffffff;
  --danger:#c2261b;
  --today:#1a6fd4;
  --focus:#4c8a45;
  /* identidad por tipo de cliente (misma en barras, gráficos y leyendas) */
  --t-dpi:#9DC3E6;
  --t-dnn:#F4B183;
  --t-om:#A9D18E;
  --t-ink:#101510;
  /* semáforo de ocupación */
  --ok-bg:#dcf0d8;--ok-ink:#265c22;
  --warn-bg:#fff3cd;--warn-ink:#7a5a06;
  --crit-bg:#fde0dd;--crit-ink:#8c1c14;
  --err-bg:#fdeceb;--err-ink:#8c1c14;
  --shadow:0 1px 2px rgba(20,35,25,.10),0 8px 24px rgba(20,35,25,.08);
  --past:rgba(230,234,231,.55);
  --cw:46px;
  --rowh:34px;
  --labelw:380px;
  --f-ui:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121613;--ink:#e8ede9;--ink-soft:#9aa9a0;--rule:#2d372f;--rule-soft:#212a23;
    --band:#1c2b1a;--band-ink:#e5ebe3;--band-2:#232c25;--band-3:#1a211c;--surface:#171d19;--chip:#1c231e;
    --danger:#ff6b5e;--today:#6aa8ff;--focus:#8fd187;
    --ok-bg:#16300f;--ok-ink:#a9e39c;--warn-bg:#3a2e08;--warn-ink:#ffd977;--crit-bg:#3a1512;--crit-ink:#ffb4ac;
    --err-bg:#3a1512;--err-ink:#ffb4ac;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
    --past:rgba(10,14,11,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121613;--ink:#e8ede9;--ink-soft:#9aa9a0;--rule:#2d372f;--rule-soft:#212a23;
  --band:#1c2b1a;--band-ink:#e5ebe3;--band-2:#232c25;--band-3:#1a211c;--surface:#171d19;--chip:#1c231e;
  --danger:#ff6b5e;--today:#6aa8ff;--focus:#8fd187;
  --ok-bg:#16300f;--ok-ink:#a9e39c;--warn-bg:#3a2e08;--warn-ink:#ffd977;--crit-bg:#3a1512;--crit-ink:#ffb4ac;
  --err-bg:#3a1512;--err-ink:#ffb4ac;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
  --past:rgba(10,14,11,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--f-ui);
  font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#errbar{display:none;background:var(--err-bg);color:var(--err-ink);border-bottom:1px solid var(--rule);
  padding:6px 16px;font:500 12px/1.4 var(--f-num)}
#errbar.on{display:block}

/* ---------- barra superior ---------- */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;
  border-bottom:1px solid var(--rule);background:var(--paper);position:relative;z-index:60}
#title{font-weight:700;font-size:17px;letter-spacing:-.01em;border:none;background:transparent;
  flex:1 1 220px;min-width:160px;max-width:380px;padding:2px 4px;border-radius:4px}
#title:hover{background:var(--band-3)}
#escName{font:600 11px/1 var(--f-num);padding:3px 6px;border-radius:3px;background:var(--band-3);color:var(--ink-soft);white-space:nowrap}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.btn{border:1px solid var(--rule);background:var(--chip);border-radius:6px;padding:5px 10px;
  font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.btn.on{background:var(--band-2);border-color:var(--ink-soft)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
.sep{width:1px;height:22px;background:var(--rule);margin:0 2px}
.zoom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
input[type=range]{width:90px;accent-color:var(--focus)}

/* ---------- franja de KPIs ---------- */
#kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-bottom:1px solid var(--rule);background:var(--surface)}
.kpi{padding:8px 16px;border-right:1px solid var(--rule-soft);min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi:last-child{border-right:none}
.kpi .k{font-size:11px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.kpi .v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kpi .v b{font:600 19px/1.15 var(--f-num);font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.crit .v b{color:var(--crit-ink)}
.mix{display:flex;height:9px;border-radius:2px;overflow:hidden;margin-top:4px;gap:2px;background:var(--paper)}
.mix i{display:block;height:100%}
.delta{font:600 11px/1 var(--f-num);padding:2px 4px;border-radius:3px;flex:0 0 auto}
.delta.late{background:var(--crit-bg);color:var(--crit-ink)}
.delta.early{background:var(--ok-bg);color:var(--ok-ink)}
.delta.same{background:var(--band-3);color:var(--ink-soft)}

#main{flex:1;min-height:0;display:flex;align-items:stretch}

/* ---------- grilla / línea de tiempo ---------- */
#wrap{flex:1;min-width:0;overflow:auto;position:relative}
#grid{position:relative;width:max-content;min-width:100%}
.lrow{display:flex;align-items:stretch}
.lcell{position:sticky;left:0;z-index:30;background:var(--paper);display:flex;
  flex:0 0 var(--labelw);width:var(--labelw);border-right:1px solid var(--rule)}
.area{flex:0 0 92px;border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;font-weight:700;font-size:13px;padding:4px 6px;background:var(--paper);gap:3px}
.area small{font-weight:500;font-size:10.5px;color:var(--ink-soft);line-height:1.2}
.area i{width:22px;height:6px;border-radius:2px;display:block}
.tname{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:13px;
  border-bottom:1px solid var(--rule-soft);height:var(--rowh);cursor:pointer}
.tname:hover{background:var(--band-3)}
.tname.sel{background:var(--band-2)}
.tname .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname.excl .nm{text-decoration:line-through;color:var(--ink-soft)}
.tname input[type=checkbox]{margin:0;accent-color:var(--focus)}
.fl{font:600 11px/1 var(--f-num);padding:2px 4px;border-radius:3px;background:var(--band-3);color:var(--ink-soft);flex:0 0 auto;white-space:nowrap}
.fl.lock{background:transparent;border:1px solid var(--rule)}
.fl.ok{background:var(--ok-bg);color:var(--ok-ink)}
.fl.warn{background:var(--warn-bg);color:var(--warn-ink)}
.fl.crit{background:var(--crit-bg);color:var(--crit-ink)}
.tname.off,.tl.off{opacity:.22}

.tl{position:relative;height:var(--rowh);border-bottom:1px solid var(--rule-soft);flex:0 0 auto}
.tl::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(to right,var(--rule-soft) 0 1px,transparent 1px var(--cw))}
.yband,.mband,.nband{display:flex;flex:0 0 auto}
.ycell,.mcell,.ncell{display:flex;align-items:center;justify-content:center;font-size:11px;height:22px;flex:0 0 auto}
.ycell{background:var(--band-2);color:var(--ink);font-weight:700;font-size:12px;border-right:1px solid var(--paper)}
.mcell{background:var(--band-3);color:var(--ink-soft);border-right:1px solid var(--rule-soft)}
.mcell.past,.ncell.past{opacity:.55;font-style:italic}
.pastzone{position:absolute;top:0;bottom:0;left:0;background:var(--past);pointer-events:none;border-right:1px solid var(--rule)}
.pastzone .lbl{position:absolute;bottom:4px;right:6px;font:600 10px/1 var(--f-num);color:var(--ink-soft);background:var(--paper);padding:2px 4px;border-radius:2px;white-space:nowrap}
.ncell{background:var(--paper);color:var(--ink);font:600 10.5px/1 var(--f-num);border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule)}
.hhead{position:sticky;left:0;z-index:31;flex:0 0 var(--labelw);width:var(--labelw);
  background:var(--band);color:var(--band-ink);border-right:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.headwrap{position:sticky;top:0;z-index:40;background:var(--paper)}
.secrow .hhead{justify-content:flex-start;padding:5px 12px;min-height:26px;gap:2px 8px;flex-wrap:wrap}
.secrow .hhead small{font-weight:500;opacity:.75;font-size:11px}
.secrow .band{background:var(--band);flex:0 0 auto}

/* barras de proyecto */
.seg{position:absolute;top:3px;height:20px;border-radius:2px;display:grid;align-items:center;
  user-select:none;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);color:var(--t-ink);
  touch-action:none;-webkit-user-select:none;cursor:pointer}
.seg.mov{cursor:grab}
.seg.dragging{cursor:grabbing;opacity:.85;z-index:15}
.seg .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3}
.seg .h.l{left:0}.seg .h.r{right:0}
.seg .h::after{content:"";position:absolute;top:4px;bottom:4px;width:2px;border-radius:1px;background:rgba(0,0,0,.35);opacity:0;transition:opacity .12s}
.seg .h.l::after{left:2px}.seg .h.r::after{right:2px}
.seg.mov:hover .h::after,.seg.sel .h::after{opacity:1}
.seg.resizing{cursor:ew-resize;opacity:.85;z-index:15}
.seg.sel{box-shadow:inset 0 0 0 1px rgba(0,0,0,.10),0 0 0 2px var(--today);z-index:12}
.seg.dim{opacity:.16;filter:grayscale(.6)}
.seg.excl{opacity:.35;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.12) 0 3px,transparent 3px 6px)!important}
.seg .c{pointer-events:none;font:600 10.5px/1 var(--f-num);text-align:center;overflow:hidden;
  border-right:1px solid rgba(0,0,0,.10);height:100%;display:flex;align-items:center;justify-content:center}
.seg .c:last-child{border-right:none}
.ghost{position:absolute;height:3px;border-radius:2px;pointer-events:none;opacity:.9;bottom:3px}
.ghost.et{background:var(--ink-soft)}
.ghost.ln{background:var(--ink);opacity:.45}
.dragtag{position:absolute;top:-1px;font:600 10px/1 var(--f-num);background:var(--band);color:var(--band-ink);
  padding:3px 5px;border-radius:3px;z-index:20;pointer-events:none;white-space:nowrap}

/* celdas de ocupación */
.occ{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  font:600 11px/1 var(--f-num);border-right:1px solid var(--paper);cursor:pointer}
.occ.ok{background:var(--ok-bg);color:var(--ok-ink)}
.occ.warn{background:var(--warn-bg);color:var(--warn-ink)}
.occ.crit{background:var(--crit-bg);color:var(--crit-ink)}
.occ.zero{background:transparent;color:var(--ink-soft);font-weight:500}
.occ.sel{box-shadow:inset 0 0 0 2px var(--today)}
.occ:hover{filter:brightness(.95)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:5px;overflow:hidden;flex:0 0 auto;background:var(--chip)}
.stepper button{border:none;background:transparent;width:22px;height:22px;font-size:14px;line-height:1;padding:0}
.stepper button:hover{background:var(--band-3)}
.stepper span{min-width:24px;text-align:center;font:600 12px/22px var(--f-num);border-left:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft)}
.esp-ele .nm b{color:var(--ink)}

/* gráfico alineado */
.tl.chart{height:150px;border-bottom:1px solid var(--rule)}
.tl.chart::before{display:none}
.chartlbl{flex:1;display:flex;flex-direction:column;gap:6px;padding:10px 8px;justify-content:center;min-width:0}
.chartlbl select{border:1px solid var(--rule);border-radius:6px;padding:4px 6px;background:var(--chip);font-size:12.5px;max-width:100%}
.leg{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.leg i{width:14px;height:10px;border-radius:2px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.leg i.line{height:2px;box-shadow:none;background:var(--ink)}
.legs{display:flex;flex-wrap:wrap;gap:4px 10px}
svg text{fill:var(--ink-soft);font:500 9.5px var(--f-num)}

.vline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--danger);z-index:20;pointer-events:none}
.vline.dashed{border-left-style:dashed}
.vline .lbl{position:absolute;bottom:4px;left:3px;font:600 10px/1 var(--f-num);color:var(--danger);
  background:var(--paper);padding:2px 3px;border-radius:2px;white-space:nowrap}
.vline.today{border-left:2px dotted var(--today)}
.vline.today .lbl{color:var(--today);bottom:22px}
#overlay{position:absolute;left:var(--labelw);top:0;bottom:0;pointer-events:none;z-index:20}

/* ---------- editor lateral ---------- */
#editor{flex:0 0 360px;overflow:auto;background:var(--surface);border-left:1px solid var(--rule);padding:14px 16px 24px}
@media (max-width:900px){
  #main{flex-direction:column}
  #editor{flex:0 0 auto;max-height:45%;border-left:none;border-top:1px solid var(--rule)}
}
#editor h3{margin:0 0 2px;font-size:15px;text-wrap:balance}
#editor h4{margin:16px 0 6px;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
#editor .sub{color:var(--ink-soft);font-size:12px;margin-bottom:12px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px}
.f input[type=text],.f input[type=number],.f input[type=month],.f select{
  width:100%;border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--chip)}
.f input[type=number]{font-family:var(--f-num);text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px}
.chk input{accent-color:var(--focus)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.45}
.holg{font-size:12px;background:var(--band-3);border-left:3px solid var(--focus);padding:6px 8px;border-radius:0 5px 5px 0;margin-bottom:10px}
.holg.crit{border-left-color:var(--danger)}
table.pk{width:100%;border-collapse:collapse;font-size:12.5px}
table.pk th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:11.5px;padding:4px 5px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.pk td{padding:4px 5px;border-bottom:1px solid var(--rule-soft)}
table.pk td.r,table.pk th.r{text-align:right}
table.pk td.calc{font:600 12px/1 var(--f-num);text-align:right;white-space:nowrap}
table.pk input,table.pk select{width:100%;border:1px solid var(--rule);border-radius:5px;padding:4px 5px;background:var(--chip);font-size:12.5px}
table.pk input[type=number]{text-align:right;font-family:var(--f-num);min-width:56px}
table.pk tr.click{cursor:pointer}
table.pk tr.click:hover td{background:var(--band-3)}
table.pk td.x button{border:none;background:transparent;color:var(--ink-soft);font-size:15px;padding:0 4px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:2px 8px;align-items:center;font-size:12px}
.hbar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.hbar .t:hover{text-decoration:underline}
.hbar .b{grid-column:1/-1;height:6px;border-radius:0 2px 2px 0;margin-bottom:6px;background:var(--band-3)}
.hbar .b i{display:block;height:100%;border-radius:0 2px 2px 0}
.hbar .v{text-align:right;font:600 11.5px/1 var(--f-num)}
.cuello{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px;align-items:center}
.cuello small{color:var(--ink-soft);grid-column:1/2}
.spark{display:block;width:100%;height:70px}

/* ---------- pie ---------- */
footer{padding:8px 16px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--rule)}
.fchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--chip);
  border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.fchip i{width:12px;height:9px;border-radius:2px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.fchip b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.fchip:hover{border-color:var(--ink-soft)}
.fchip.on{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.fchip.on b{color:var(--band-ink)}
.sem{display:inline-flex;align-items:center;gap:4px}
.sem i{font:600 10px/1 var(--f-num);padding:2px 4px;border-radius:3px;font-style:normal}

/* ---------- diálogo, tooltip, toast ---------- */
dialog{z-index:1000;position:fixed;margin:0;left:50%;top:7vh;transform:translateX(-50%);max-height:86vh;overflow:auto;
  border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);padding:0 16px 16px;
  max-width:560px;width:92%;box-shadow:0 10px 34px rgba(10,20,14,.22),0 2px 6px rgba(10,20,14,.12)}
dialog.wide{max-width:980px}
dialog::backdrop{background:transparent}
#dlgBar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;margin:0 -16px 12px;
  padding:9px 14px;background:var(--band);color:var(--band-ink);cursor:grab;touch-action:none;user-select:none;border-radius:9px 9px 0 0}
dialog.moving #dlgBar{cursor:grabbing}
#dlgBar .grab{opacity:.65;font-size:14px;letter-spacing:-2px}
#dlgBar .hintbar{font-size:10.5px;opacity:.6;white-space:nowrap}
#dlgTitle{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dlgX{border:none;background:transparent;color:var(--band-ink);font-size:14px;padding:2px 4px;border-radius:4px;opacity:.8}
#dlgX:hover{opacity:1}
#dlgBody h3:first-child{margin-top:0}
.sc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule-soft)}
.sc small{color:var(--ink-soft)}
.tablewrap{overflow-x:auto}
/* parámetros */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--rule-soft)}
.psub{color:var(--ink-soft);font-size:12px;line-height:1.45;max-width:72ch}
.pgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}}
table.pk td.tam{font-weight:600;vertical-align:top;padding-top:8px}
table.pk tr.grp td{border-top:1px solid var(--rule)}
table.pk input.pct{min-width:58px}
table.cm{font-size:12px}
table.cm th,table.cm td{padding:3px 3px;text-align:right}
table.cm th:first-child,table.cm td:first-child{text-align:left;white-space:nowrap;padding-right:8px}
table.cm input[type=number]{min-width:0;width:58px;padding:3px 4px;font-size:11.5px}
table.cm tfoot td{font:600 11px/1.2 var(--f-num);color:var(--ink-soft);border-bottom:none}
.mb{height:26px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:2px}
.mb i{display:block;width:60%;min-height:1px;background:var(--ink-soft);border-radius:2px 2px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
/* carpeta compartida */
#fsBar{display:none;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:7px 16px;border-bottom:1px solid var(--rule);background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px}
#fsBar.on{display:flex}
#fsBar.crit{background:var(--crit-bg);color:var(--crit-ink)}
#fsBar .btn{color:var(--ink)}
#fsChip{cursor:pointer;border:1px solid var(--rule);background:var(--chip);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
#fsChip b{color:var(--ink);font-weight:600}
#fsChip.dirty{border-color:var(--warn-ink);color:var(--warn-ink)}
#fsChip:hover{border-color:var(--ink-soft)}
ol.pasos{margin:6px 0 0;padding-left:20px;font-size:12.5px;line-height:1.55}
#tip{position:fixed;z-index:1200;pointer-events:none;background:var(--band);color:var(--band-ink);border-radius:6px;
  padding:7px 9px;font-size:12px;line-height:1.4;box-shadow:var(--shadow);max-width:280px;display:none}
#tip.on{display:block}
#tip b{font-family:var(--f-num)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--band);color:var(--band-ink);
  padding:8px 14px;border-radius:7px;font-size:13px;z-index:1300;opacity:0;pointer-events:none;transition:opacity .18s}
#toast.on{opacity:1}
#buscar{display:none}
#buscar.on{display:flex;align-items:center;gap:6px;padding:6px 16px;border-bottom:1px solid var(--rule);background:var(--band-3)}
#buscarInp{flex:1;max-width:320px;border:1px solid var(--rule);border-radius:6px;padding:5px 9px;background:var(--chip)}
table.atajos{width:100%;border-collapse:collapse;font-size:12.5px}
table.atajos td{padding:4px 6px;border-bottom:1px solid var(--rule-soft)}
table.atajos td:first-child{width:190px;white-space:nowrap}
kbd{font:600 11px var(--f-num);background:var(--band-3);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:2px 5px;white-space:nowrap}
.muestra{font:600 10.5px/1 var(--f-num);padding:3px 6px;border-radius:3px;border:1px dashed var(--rule);color:var(--ink-soft)}
@media (max-width:700px){
  :root{--labelw:230px}
  .area{flex:0 0 54px;font-size:11px}
  .area small{display:none}
  .tname .fl.hide-s{display:none}
  header{gap:8px}
  .tools{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px}
  #kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi{padding:6px 10px}
  .kpi .s{display:none}
  .kpi .v b{font-size:16px}
}
@media (prefers-reduced-motion:reduce){#toast,.seg .h::after{transition:none}}
</style>
</head>
<body>

<header>
  <input id="title" value="Plan de capacidad · Ingeniería" aria-label="Título del plan">
  <span id="escName" title="Escenario abierto"></span>
  <button id="fsChip" title="Carpeta compartida (OneDrive / SharePoint)">Sin carpeta compartida</button>
  <span class="muestra" title="Proyectos del CSV de SharePoint; parámetros, curvas y dotación son ilustrativos">capacidad de ejemplo</span>
  <div class="tools">
    <button class="btn" id="addBtn">Agregar proyecto</button>
    <button class="btn" id="undo" disabled>Deshacer</button>
    <div class="sep"></div>
    <button class="btn" id="resBtn" title="Dotación, HH por persona, eficiencia, horizonte">Recursos</button>
    <button class="btn" id="parBtn" title="Tablas de HH por tecnología y tamaño, ET, Línea, DNN, O&amp;M y curvas">Parámetros</button>
    <button class="btn" id="minBtn" title="Personas mínimas para que ningún mes supere el 100 %">Nivelar</button>
    <div class="sep"></div>
    <button class="btn primary" id="fsSave" title="Guardar el plan en la carpeta compartida (Ctrl+S)">Guardar</button>
    <button class="btn" id="scenBtn">Escenarios</button>
    <button class="btn" id="cmpBtn">Comparar</button>
    <button class="btn" id="pdfBtn" title="Reporte PDF para la dirección">Reporte PDF</button>
    <button class="btn" id="exportBtn">Exportar</button>
    <button class="btn" id="importBtn" title="Escenario (JSON) o lista de proyectos exportada de SharePoint (CSV)">Importar</button>
    <input type="file" id="file" accept=".json,.csv" hidden>
    <div class="sep"></div>
    <div class="zoom"><label for="zoom">Zoom</label><input type="range" id="zoom" min="30" max="80" value="46"></div>
    <button class="btn" id="kbdBtn" title="Atajos de teclado (F1)">⌨</button>
    <button class="btn" id="theme" title="Claro / oscuro">◐</button>
  </div>
</header>

<div id="kpis"></div>
<div id="fsBar" role="status"></div>
<div id="buscar"><input type="text" id="buscarInp" placeholder="Buscar proyecto…" aria-label="Buscar proyecto"><button class="btn sm" id="buscarX" title="Cerrar">✕</button></div>
<div id="errbar"></div>

<div id="main">
  <div id="wrap">
    <div id="grid">
      <div class="headwrap" id="head"></div>
      <div id="rows"></div>
      <div id="cap"></div>
      <div id="overlay"></div>
    </div>
  </div>
  <div id="editor"></div>
</div>

<footer id="legend"></footer>

<dialog id="dlg">
  <div id="dlgBar"><span class="grab">⠿</span><span id="dlgTitle"></span><span class="hintbar">arrastrá para mover · doble clic para centrar</span><button id="dlgX" title="Cerrar">✕</button></div>
  <div id="dlgBody"></div>
  <div class="row-actions" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="dlgClose">Cerrar</button></div>
</dialog>
<div id="tip"></div>
<div id="toast"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function(){
"use strict";
window.addEventListener("error",function(ev){
  var b=document.getElementById("errbar");if(!b)return;
  b.className="on";b.textContent="Error: "+(ev.message||"")+" (línea "+ev.lineno+")";
});

/* ===================== constantes ===================== */
var E=window.CapEngine;
var KEY="capacidad-ing-v1";
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var TIPOS=[
  {k:"DPI",n:"DPI",d:"Dirección de Proyectos",c:"var(--t-dpi)",hex:"#9DC3E6"},
  {k:"DNN",n:"DNN",d:"Desarrollo de Nuevos Negocios",c:"var(--t-dnn)",hex:"#F4B183"},
  {k:"O&M",n:"O&M",d:"Operación y Mantenimiento",c:"var(--t-om)",hex:"#A9D18E"}
];
var TIPO={};TIPOS.forEach(function(t){TIPO[t.k]=t;});
var TECNOS=["Solar","Bess","Eólico","Termico"];
var ABREV={"Civiles":"Civ.","Coordinadores":"Coord.","Eléctricos":"Eléc.","Electrónicos":"Electrón.","Mecánicos":"Mec."};
var TAMANOS=["Chico","Mediano","Grande","Muy Grande"];
var ESTADOS=["No Iniciado","En Proceso","Finalizado"];
var NF0=new Intl.NumberFormat("es-AR",{maximumFractionDigits:0});
var NF2=new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
var NFP=new Intl.NumberFormat("es-AR",{style:"percent",maximumFractionDigits:0});

/* ===================== utilidades ===================== */
function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function px(n){return n+"px";}
function hh(n){return NF0.format(Math.round(n));}
function hhK(n){if(n<0.5)return "";if(n>=9950)return (n/1000).toFixed(0)+"k";if(n>=1000)return (n/1000).toFixed(1).replace(".",",")+"k";return String(Math.round(n));}
function oc(v){return v===Infinity?"∞":NF2.format(v);}
function sem(v){return v>=1?"crit":v>=0.8?"warn":"ok";}
function semTxt(v){return v>=1?"rojo":v>=0.8?"amarillo":"verde";}
function mlabel(ym){if(!ym)return "—";var p=ym.split("-");return MES[+p[1]-1]+"-"+p[0].slice(2);}
function nextId(){var m=0;S.datos.proyectos.forEach(function(p){m=Math.max(m,+p.id||0);});return m+1;}
function findP(id){for(var i=0;i<S.datos.proyectos.length;i++)if(String(S.datos.proyectos[i].id)===String(id))return S.datos.proyectos[i];return null;}
function todayYM(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}

/* ===================== estado ===================== */
/* S.datos = dataset de trabajo (equivale a DIM_Proyecto + DIM_Curvas + Capacidad).
   S.base  = foto de referencia contra la que se muestran los deltas. */
var S=null,R=null,RB=null,sel=null,undoStack=[],redoStack=[],downloads=null,dlg,ed;
function nuevoWS(){
  var d=clone(window.SAMPLE_DATA);
  return {version:versionDatos(),fsRev:0,fsCarpeta:"",dirty:false,title:"Plan de capacidad · Ingeniería",nombre:"Base",datos:d,base:clone(d),baseNombre:"Base",
    cw:46,filtro:"",espChart:"",q:""};
}
function versionDatos(){return (window.SAMPLE_DATA.meta&&window.SAMPLE_DATA.meta.version)||"1";}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){
  var raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){try{
    var o=JSON.parse(raw);
    /* si cambió el dataset publicado (p. ej. nueva lista de proyectos) se arranca de cero;
       los escenarios guardados siguen disponibles en «Escenarios» */
    if(o&&o.datos&&o.datos.proyectos&&o.version===versionDatos())return o;
    if(o&&o.datos)setTimeout(function(){toast("Se cargó la lista de proyectos actualizada");},600);
  }catch(e){}}
  return nuevoWS();
}
function snap(){return clone({datos:S.datos,nombre:S.nombre});}
function push(){undoStack.push(snap());if(undoStack.length>60)undoStack.shift();redoStack=[];updUndo();S.dirty=true;fsChip();}
function undo(){if(!undoStack.length)return;redoStack.push(snap());var p=undoStack.pop();S.datos=p.datos;S.nombre=p.nombre;recalc();render();save();refreshParam();toast("Deshecho");}
function redo(){if(!redoStack.length)return;undoStack.push(snap());var p=redoStack.pop();S.datos=p.datos;S.nombre=p.nombre;recalc();render();save();refreshParam();}
function updUndo(){document.getElementById("undo").disabled=!undoStack.length;}

/* ===================== cálculo ===================== */
/* El filtro por tipo de cliente actúa como un segmentador de Power BI:
   la demanda se limita a ese tipo, la capacidad no cambia. */
function kpiDesde(d){return (d.horizonte&&d.horizonte.kpiDesde)||todayYM();}
/* vista para el motor: indicadores desde el mes actual (o el fijado en Recursos) y filtro por tipo de cliente */
function datosVista(d){
  var v=Object.assign({},d,{horizonte:Object.assign({},d.horizonte,{kpiDesde:kpiDesde(d)})});
  if(!S.filtro)return v;
  v.proyectos=d.proyectos.map(function(p){return p.tipoCliente===S.filtro?p:Object.assign({},p,{incluir:false});});
  return v;
}
function recalc(){R=E.calcular(datosVista(S.datos));RB=E.calcular(datosVista(S.base));}
function mIdx(ym){return E.mesIdx(ym)-E.mesIdx(S.datos.horizonte.desde);}
/* span de un proyecto: inicio y duración en meses (componente más largo) */
function spanOf(p){
  var comps=E.componentes(p,S.datos.parametros),base=0,dur=0,parts=[];
  comps.forEach(function(c){base=Math.max(base,E.largoCurva(S.datos.curvas,c.curva));});
  comps.forEach(function(c){
    var nc=E.largoCurva(S.datos.curvas,c.curva),n=E.largoComponente(nc,base,p.duracion);
    parts.push({c:c,n:n,n0:nc});dur=Math.max(dur,n);
  });
  return {start:mIdx(p.fechaInicio)+(+p.desplazamiento||0),dur:dur,base:base,comps:comps,parts:parts};
}
function durMod(p){return p.duracion!=null&&p.duracion!=="";}
/* fija la duración; si coincide con la de las curvas vuelve a "automática" */
function setDur(p,n){var b=spanOf(Object.assign({},p,{duracion:null})).base;n=Math.max(1,Math.min(60,Math.round(n)));p.duracion=(n===b)?null:n;}
/* HH mensuales de un proyecto (todas las especialidades) */
function hhMensual(p){
  var f=E.forecast([Object.assign({incluir:true},p)],S.datos.curvas,S.datos.parametros),m0=E.mesIdx(S.datos.horizonte.desde),out={};
  f.forEach(function(r){var i=r.mes-m0;out[i]=(out[i]||0)+r.hh;});
  return out;
}
function totalP(p){var t=0;E.componentes(p,S.datos.parametros).forEach(function(c){t+=c.hh;});return t*(p.factorSolapamiento==null||p.factorSolapamiento===""?1:+p.factorSolapamiento);}

/* ===================== render: cabecera ===================== */
function renderHead(){
  var h=document.getElementById("head"),n=R.meses.length,cw=S.cw,years=[],cur=null,i;
  R.meses.forEach(function(ym){var y=ym.slice(0,4);if(!cur||cur.y!==y){cur={y:y,n:0};years.push(cur);}cur.n++;});
  var yb='<div class="lrow"><div class="hhead" style="height:22px;border-bottom:1px solid var(--rule)">Tipo · Proyecto</div><div class="yband">';
  years.forEach(function(g){yb+='<div class="ycell" style="width:'+px(g.n*cw)+'">'+g.y+'</div>';});
  var mb='<div class="lrow"><div class="hhead" style="height:22px;border-bottom:1px solid var(--rule)"></div><div class="mband">';
  var nb='<div class="lrow"><div class="hhead" style="height:22px;border-bottom:1px solid var(--rule);font-weight:500;font-size:11px;opacity:.85">HH forecast del mes</div><div class="nband">';
  for(i=0;i<n;i++){
    var tot=R.demanda[i].reduce(function(a,b){return a+b;},0);
    var pas=R.meses[i]<R.kpiDesde?" past":"";
    mb+='<div class="mcell'+pas+'" style="width:'+px(cw)+'">'+MES[+R.meses[i].slice(5)-1]+'</div>';
    nb+='<div class="ncell'+pas+'" style="width:'+px(cw)+'">'+hhK(tot)+'</div>';
  }
  h.innerHTML=yb+'</div></div>'+mb+'</div></div>'+nb+'</div></div>';
}

/* ===================== render: proyectos (Gantt) ===================== */
function renderRows(){
  var box=document.getElementById("rows"),w=R.meses.length*S.cw,html="";
  TIPOS.forEach(function(t){
    var items=S.datos.proyectos.filter(function(p){return p.tipoCliente===t.k;});
    if(!items.length)return;
    var names="",tls="";
    items.forEach(function(p){
      var hit=!S.q||(p.proyecto+" "+(p.nombre||"")+" "+p.tecnologia).toLowerCase().indexOf(S.q)>=0;
      var excl=p.incluir===false,isSel=sel&&sel.p===String(p.id);
      var tot=totalP(p);
      names+='<div class="tname'+(isSel?" sel":"")+(excl?" excl":"")+(hit?"":" off")+'" data-p="'+esc(p.id)+'">'
        +'<input type="checkbox" data-inc="'+esc(p.id)+'"'+(excl?"":" checked")+' title="Incluir en el cálculo" aria-label="Incluir '+esc(p.proyecto)+'">'
        +'<span class="nm" title="'+esc(p.proyecto+(p.nombre?" · "+p.nombre:"")+(p.estado?" · "+p.estado:""))+'">'+esc(p.proyecto)+(p.nombre?' <small style="color:var(--ink-soft)">'+esc(p.nombre)+'</small>':'')+'</span>'
        +'<span class="fl hide-s">'+esc(p.tecnologia)+' '+NF0.format(+p.potencia||0)+' MW</span>'
        +'<span class="fl">'+hhK(tot)+'</span>'
        +(durMod(p)?'<span class="fl warn" title="Duración modificada: '+spanOf(p).base+' meses según curvas">'+p.duracion+' m</span>':'')
        +(p.simulable?'':'<span class="fl lock" title="Proyecto no simulable: fecha fija">fijo</span>')
        +'</div>';
      tls+=barHTML(p,w,hit);
    });
    html+='<div class="lrow"><div class="lcell"><div class="area"><i style="background:'+t.c+'"></i>'+t.n+'<small>'+t.d+'</small></div>'
      +'<div style="flex:1;min-width:0">'+names+'</div></div><div>'+tls+'</div></div>';
  });
  box.innerHTML=html;
}
function barHTML(p,w,hit){
  var sp=spanOf(p),cw=S.cw,m=hhMensual(p),t=TIPO[p.tipoCliente]||TIPOS[0];
  var cls="seg"+(p.simulable?" mov":"")+(sel&&sel.p===String(p.id)?" sel":"")+(p.incluir===false?" excl":"")
    +(S.filtro&&S.filtro!==p.tipoCliente?" dim":"");
  var cells="";
  for(var k=0;k<sp.dur;k++){cells+='<div class="c">'+(cw>=38?hhK(m[sp.start+k]||0):"")+'</div>';}
  var g="";
  sp.parts.forEach(function(pt){
    if(pt.c.componente==="ET")g+='<div class="ghost et" style="left:'+px(sp.start*cw+2)+';width:'+px(pt.n*cw-4)+'" title="ET"></div>';
    if(pt.c.componente==="Línea")g+='<div class="ghost ln" style="left:'+px(sp.start*cw+2)+';width:'+px(pt.n*cw-4)+';bottom:0"></div>';
  });
  var hd=p.simulable?'<div class="h l" data-h="l" title="Arrastrá para cambiar el inicio y la duración"></div><div class="h r" data-h="r" title="Arrastrá para cambiar la duración"></div>':'';
  return '<div class="tl'+(hit?"":" off")+'" style="width:'+px(w)+'">'
    +'<div class="'+cls+'" data-seg="'+esc(p.id)+'" style="left:'+px(sp.start*cw)+';width:'+px(sp.dur*cw)
    +';background:'+t.c+';grid-template-columns:repeat('+sp.dur+',1fr)">'+cells+hd+'</div>'+g+'</div>';
}

/* ===================== render: capacidad / ocupación ===================== */
function renderCap(){
  var box=document.getElementById("cap"),n=R.meses.length,cw=S.cw,w=n*cw,html="";
  var cap=S.datos.capacidad,hp=cap.hhMesPersona*cap.eficiencia;
  html+='<div class="lrow secrow"><div class="hhead">Ocupación por especialidad <small>HH forecast ÷ capacidad · '+NF0.format(hp)+' HH/persona·mes</small></div><div class="band" style="width:'+px(w)+'"></div></div>';
  R.especialidades.forEach(function(e,j){
    var cu=R.cuellos[e],pers=cap.dotacion[e]||0,isSel=sel&&sel.e===e&&!sel.m;
    var tag=cu.mesesCriticos?'<span class="fl crit" title="Meses con ocupación &gt; 1">'+cu.mesesCriticos+' m &gt;1</span>':'<span class="fl ok">sin exceso</span>';
    html+='<div class="lrow"><div class="lcell"><div class="tname'+(isSel?" sel":"")+'" data-e="'+esc(e)+'" style="padding-left:12px">'
      +'<span class="nm"><b>'+esc(e)+'</b></span>'+tag
      +'<span class="stepper" title="Personas asignadas"><button data-dot="'+esc(e)+'" data-d="-1" aria-label="Quitar una persona en '+esc(e)+'">−</button><span>'+pers+'</span><button data-dot="'+esc(e)+'" data-d="1" aria-label="Sumar una persona en '+esc(e)+'">+</button></span>'
      +'</div></div><div class="tl" style="width:'+px(w)+'">';
    for(var i=0;i<n;i++){
      var v=R.ocupacion[i][j],d=R.demanda[i][j];
      var c=(d<0.5&&v<0.005)?"zero":sem(v);
      var isC=sel&&sel.e===e&&sel.m===R.meses[i];
      html+='<div class="occ '+c+(isC?" sel":"")+'" data-cell="'+i+'|'+j+'" style="left:'+px(i*cw)+';width:'+px(cw)+'">'+(c==="zero"?"·":(cw>=36?oc(v):""))+'</div>';
    }
    html+='</div></div>';
  });
  /* fila total */
  html+='<div class="lrow"><div class="lcell"><div class="tname" style="padding-left:12px;cursor:default"><span class="nm"><b>Total área</b></span><span class="fl">'+NF0.format(totPersonas())+' pers.</span></div></div><div class="tl" style="width:'+px(w)+'">';
  for(var i2=0;i2<n;i2++){
    var dd=R.demanda[i2].reduce(function(a,b){return a+b;},0),cc=R.capacidad[i2].reduce(function(a,b){return a+b;},0),vv=cc?dd/cc:0;
    var c2=dd<0.5?"zero":sem(vv);
    html+='<div class="occ '+c2+'" data-tot="'+i2+'" style="left:'+px(i2*cw)+';width:'+px(cw)+';cursor:default">'+(c2==="zero"?"·":(cw>=36?oc(vv):""))+'</div>';
  }
  html+='</div></div>';
  /* gráfico demanda vs capacidad alineado a la línea de tiempo */
  var opts='<option value="">Todas las especialidades</option>'+R.especialidades.map(function(e){return '<option'+(S.espChart===e?" selected":"")+'>'+esc(e)+'</option>';}).join("");
  html+='<div class="lrow secrow"><div class="hhead">Demanda vs capacidad <small>HH por mes</small></div><div class="band" style="width:'+px(w)+'"></div></div>';
  html+='<div class="lrow"><div class="lcell"><div class="chartlbl"><select id="espChart" aria-label="Especialidad del gráfico">'+opts+'</select>'
    +'<div class="legs">'+TIPOS.map(function(t){return '<span class="leg"><i style="background:'+t.c+'"></i>'+t.n+'</span>';}).join("")
    +'<span class="leg"><i class="line"></i>Capacidad</span></div></div></div>'
    +'<div class="tl chart" style="width:'+px(w)+'">'+chartSVG(w)+'</div></div>';
  box.innerHTML=html;
}

function serieChart(){

    var tipos=j<0?R.demandaPorTipo[i]:R.demandaPorTipoEsp[i][j];

    return {tipos:tipos,dem:tipos.reduce(function(a,b){return a+b;},0),cap:cap};
  });

function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function chartSVG(w){
  var H=150,top=12,bot=16,cw=S.cw,s=serieChart();
  var mx=niceMax(Math.max.apply(null,s.map(function(r){return Math.max(r.dem,r.cap);}))*1.05);
  var y=function(v){return top+(H-top-bot)*(1-v/mx);};
  var g='<svg width="'+w+'" height="'+H+'" role="img" aria-label="Demanda por tipo de cliente y capacidad por mes">';
  [0.5,1].forEach(function(f){var yy=y(mx*f);g+='<line x1="0" x2="'+w+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--rule-soft)" stroke-width="1"/><text x="4" y="'+(yy-3)+'">'+hhK(mx*f)+'</text>';});
  var path="";
  s.forEach(function(r,i){
    var x=i*cw+4,bw=Math.max(2,cw-8),acc=0;
    r.tipos.forEach(function(v,t){
      if(v<=0)return;
      var y1=y(acc+v),y0=y(acc),hgt=Math.max(0,y0-y1-(acc>0?2:0));
      g+='<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+hgt+'" fill="'+TIPOS[t].c+'" rx="'+(acc+v>=r.dem-0.01?2:0)+'"/>';
      acc+=v;
    });
    if(r.dem>r.cap&&r.cap>0){g+='<rect x="'+x+'" y="'+y(r.dem)+'" width="'+bw+'" height="'+Math.max(1,y(r.cap)-y(r.dem))+'" fill="none" stroke="var(--danger)" stroke-width="1.5"/>';}
    var yc=y(r.cap);
    path+=(i===0?"M":"L")+(i*cw)+" "+yc+" L"+((i+1)*cw)+" "+yc+" ";
    g+='<rect x="'+(i*cw)+'" y="0" width="'+cw+'" height="'+H+'" fill="transparent" data-bar="'+i+'"/>';
  });
  g+='<path d="'+path+'" fill="none" stroke="var(--ink)" stroke-width="2"/>';
  g+='<line x1="0" x2="'+w+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--rule)" stroke-width="1"/>';
  return g+'</svg>';
}

function dchip(a,b,menorEsMejor,fmt){
  var d=a-b;if(Math.abs(d)<0.005)return '<span class="delta same" title="Igual que '+esc(S.baseNombre)+'">= base</span>';
  var mejor=menorEsMejor?d<0:d>0;
  return '<span class="delta '+(mejor?"early":"late")+'" title="Diferencia contra '+esc(S.baseNombre)+'">'+(d>0?"+":"−")+fmt(Math.abs(d))+'</span>';
}
function renderKPIs(){
  var k=R.kpis,kb=RB.kpis,mo=k.maxOcupacion,pc=k.primerMesCritico,pcb=kb.primerMesCritico;
  var mixT=R.mixTipoCliente,tot=k.hhForecastTotal||1;
  var etl=(R.mixComponente["ET"]||0)+(R.mixComponente["Línea"]||0);

  if(pc&&pcb){var dm=E.mesIdx(pc.mes)-E.mesIdx(pcb.mes);pcD=dm===0?'<span class="delta same">= base</span>':'<span class="delta '+(dm>0?"early":"late")+'">'+(dm>0?"+":"−")+Math.abs(dm)+' m</span>';}
  else if(!pc&&pcb)pcD='<span class="delta early">sin crítico</span>';
  else if(pc&&!pcb)pcD='<span class="delta late">nuevo</span>';
  var html=''
   +kpi("Máxima ocupación",oc(mo.valor),dchip(mo.valor,kb.maxOcupacion.valor,true,function(v){return NF2.format(v);}),mo.especialidad?esc(mo.especialidad)+" · "+mlabel(mo.mes):"—",mo.valor>=1)
   +kpi("Primer mes crítico",pc?mlabel(pc.mes):"ninguno",pcD,pc?esc(pc.especialidades.join(", ")):"Ningún mes supera 1,00 desde "+mlabel(R.kpiDesde),!!pc)
   +kpi("HH excedidas",hh(k.hhExcedidas),dchip(k.hhExcedidas,kb.hhExcedidas,true,hh),"Demanda por encima de la capacidad",k.hhExcedidas>0.5)
   +kpi("HH forecast",hh(k.hhForecastHorizonte),dchip(k.hhForecastHorizonte,kb.hhForecastHorizonte,true,hh),"Desde "+mlabel(R.kpiDesde)+" a "+mlabel(R.meses[R.meses.length-1]),false)
   +'<div class="kpi"><span class="k">DPI · DNN · O&amp;M</span><span class="v" style="font:600 12.5px/1.3 var(--f-num)">'
     +TIPOS.map(function(t){return t.n+" "+NFP.format((mixT[t.k]||0)/tot);}).join(" · ")+'</span>'
     +'<div class="mix">'+TIPOS.map(function(t){var f=(mixT[t.k]||0)/tot;return f>0?'<i style="width:'+(f*100)+'%;background:'+t.c+'" title="'+t.n+': '+hh(mixT[t.k]||0)+' HH"></i>':"";}).join("")+'</div></div>'

  document.getElementById("kpis").innerHTML=html;

/* Barre duraciones y muestra las HH excedidas de cada una (misma idea que «Mejor inicio») */
function mejorDuracion(p){
  var base=spanOf(Object.assign({},p,{duracion:null})).base,actual=spanOf(p).dur,dv=datosVista(S.datos);
  var lo=Math.max(1,Math.ceil(base*0.5)),hi=Math.min(60,Math.floor(base*2)),pr=[];
  for(var n=lo;n<=hi;n++){
    var cambios={proyectos:{}};cambios.proyectos[String(p.id)]={duracion:n};
    pr.push({n:n,exc:E.calcular(dv,cambios).kpis.hhExcedidas});
  }

  var cur=pr.filter(function(x){return x.n===actual;})[0]||{exc:R.kpis.hhExcedidas};
  var mx=Math.max.apply(null,pr.map(function(x){return x.exc;}))||1,W=320,H=70,bw=W/pr.length;

    +'<div class="holg'+(best.n===actual?"":" crit")+'">'+(best.n===actual?'La duración actual ('+actual+' meses) ya es la mejor del rango probado.'

/* ===================== arrastre de barras ===================== */
var drag=null;
function wireDrag(){
  var rows=document.getElementById("rows");
  rows.addEventListener("pointerdown",function(e){
    var b=e.target.closest(".seg");if(!b)return;
    var p=findP(b.dataset.seg);if(!p)return;
    if(!p.simulable){sel_({p:String(p.id)});toast("Proyecto no simulable: fecha y duración fijas");return;}
    var h=e.target.closest(".h"),sp=spanOf(p);
    drag={el:b,p:p,mode:h?h.dataset.h:"m",x0:e.clientX,k:0,orig:p.fechaInicio,origDur:p.duracion==null?null:p.duracion,
      dur0:sp.dur,left:parseFloat(b.style.left),width:parseFloat(b.style.width)};
    b.setPointerCapture(e.pointerId);b.classList.add(h?"resizing":"dragging");
    e.preventDefault();
  });
  rows.addEventListener("pointermove",function(e){
    if(!drag)return;
    var d=drag,dx=e.clientX-d.x0,cw=S.cw,k=Math.round(dx/cw);
    if(d.mode==="r"){k=Math.max(1-d.dur0,k);d.el.style.width=px(Math.max(cw,d.width+dx));}
    else if(d.mode==="l"){k=Math.min(d.dur0-1,k);var dd=Math.min(dx,d.width-cw);d.el.style.left=px(d.left+dd);d.el.style.width=px(d.width-dd);}
    else d.el.style.left=px(d.left+dx);
    if(k===d.k)return;
    d.k=k;
    var txt;
    if(d.mode==="m"){d.p.fechaInicio=E.mesStr(E.mesIdx(d.orig)+k);txt=(k>0?"+":"")+k+" m · "+mlabel(d.p.fechaInicio);}
    else{
      d.p.duracion=d.origDur;
      if(d.mode==="l")d.p.fechaInicio=E.mesStr(E.mesIdx(d.orig)+k);
      setDur(d.p,d.dur0+(d.mode==="r"?k:-k));
      txt=d.dur0+" → "+spanOf(d.p).dur+" meses"+(d.mode==="l"?" · inicio "+mlabel(d.p.fechaInicio):"");
    }
    recalc();renderLive();
    var tag=document.querySelector(".dragtag");
    if(!tag){tag=document.createElement("div");tag.className="dragtag";d.el.parentNode.appendChild(tag);}
    tag.style.left=px(d.mode==="r"?d.left:d.left+k*cw);
    tag.textContent=txt;
  });
  function end(){
    if(!drag)return;
    var d=drag;drag=null;
    if(d.k!==0){
      var fin=d.p.fechaInicio,durFin=d.p.duracion==null?null:d.p.duracion;
      d.p.fechaInicio=d.orig;d.p.duracion=d.origDur;push();d.p.fechaInicio=fin;d.p.duracion=durFin;
      if(d.mode==="m")toast(d.p.proyecto+" "+(d.k>0?"+":"")+d.k+" meses");
      else toast(d.p.proyecto+": "+spanOf(d.p).dur+" meses de duración");
    }
    sel={p:String(d.p.id)};recalc();render();save();
  }
  rows.addEventListener("pointerup",end);
  rows.addEventListener("pointercancel",end);
}

function keyOf(el){
  if(!el||!el.attributes)return null;
  for(var i=0;i<el.attributes.length;i++){var a=el.attributes[i];if(/^data-(pp|et|ln|fx|fdnn|cf|pdel|padd|cact|ptab|ptec|preset)$/.test(a.name))return '['+a.name+'="'+a.value.replace(/"/g,'\\"')+'"]';}
  return el.id==="pcurSel"?"#pcurSel":null;
}
function wireParam(){
  var box=document.getElementById("parBox");
  box.onclick=function(e){
    var b=e.target.closest("button,[data-goto]");if(!b)return;
    var P=S.datos.parametros,C=S.datos.curvas,d=b.dataset;
    if(d.goto){sel_({p:d.goto});return;}
    if(d.ptab){PTAB=d.ptab;renderParam();return;}
    if(d.ptec){PTEC=d.ptec;renderParam();return;}
    if(d.padd){
      push();var key=PTEC+"|"+d.padd,pts=P.parque[key]=P.parque[key]||[];
      var last=pts[pts.length-1];pts.push(last?[Math.round(last[0]*1.5),Math.round(last[1]*1.3)]:[100,1000]);
      aplicarParam();return;
    }
    if(d.pdel){var a=d.pdel.split("|"),pts2=P.parque[PTEC+"|"+a[0]];if(pts2.length<2)return;push();pts2.splice(+a[1],1);aplicarParam();return;}
    if(d.cact){
      var cur=C[PCUR],n=E.largoCurva(C,PCUR);
      push();
      R.especialidades.forEach(function(e){var f=cur[e]=cur[e]||[];while(f.length<n)f.push(0);});
      if(d.cact==="add")Object.keys(cur).forEach(function(e){cur[e].push(0);});
      if(d.cact==="del")Object.keys(cur).forEach(function(e){cur[e].pop();});
      if(d.cact==="norm"){
        var t=0;Object.keys(cur).forEach(function(e){cur[e].forEach(function(f){t+=f;});});
        if(t>0)Object.keys(cur).forEach(function(e){cur[e]=cur[e].map(function(f){return Math.round(f/t*1e6)/1e6;});});
      }
      aplicarParam();toast(d.cact==="norm"?"Curva normalizada a 100 %":"Curva "+PCUR+": "+E.largoCurva(C,PCUR)+" meses");return;
    }
    if(d.preset){
      var M=window.SAMPLE_DATA.parametros;push();
      if(PTAB==="parque")TAMANOS.forEach(function(t){var k=PTEC+"|"+t;if(M.parque[k])P.parque[k]=clone(M.parque[k]);else delete P.parque[k];});
      if(PTAB==="etl"){P.et=clone(M.et);P.linea=clone(M.linea);P.factorAmpliacionET=M.factorAmpliacionET;P.factorLineaMT=M.factorLineaMT;}
      if(PTAB==="dnn"){P.factorDNN=clone(M.factorDNN);P.factorOM=M.factorOM;}
      if(PTAB==="curvas"&&window.SAMPLE_DATA.curvas[PCUR])C[PCUR]=clone(window.SAMPLE_DATA.curvas[PCUR]);
      aplicarParam();toast("Valores de ejemplo restaurados · Ctrl+Z para deshacer");
    }
  };
  box.onchange=function(e){
    var t=e.target;
    if(t.id==="pcurSel"){PCUR=t.value;renderParam();return;}
    var d0=t.dataset;if(!(d0.pp||d0.et||d0.ln||d0.fx||d0.fdnn||d0.cf))return;
    var v=parseFloat(String(t.value).replace(",","."));
    if(isNaN(v)||v<0){toast("Ingresá un número mayor o igual a cero");renderParam();return;}
    var P=S.datos.parametros,C=S.datos.curvas,d=t.dataset;
    push();
    if(d.pp){var a=d.pp.split("|"),pts=P.parque[PTEC+"|"+a[0]];pts[+a[1]][+a[2]]=v;pts.sort(function(x,y){return x[0]-y[0];});}
    else if(d.et)P.et[d.et]=v;
    else if(d.ln)P.linea[d.ln]=v;
    else if(d.fx)P[d.fx]=v/100;
    else if(d.fdnn)P.factorDNN[d.fdnn]=v/100;
    else if(d.cf){var b=d.cf.split("|"),f=C[PCUR][b[0]]=C[PCUR][b[0]]||[];while(f.length<=+b[1])f.push(0);f[+b[1]]=Math.round(v*1e4)/1e6;}
    aplicarParam();
  };
}
/* recalcula, y re-dibuja el diálogo conservando el campo que tenía el foco */
function aplicarParam(){
  recalc();render();save();
  setTimeout(function(){
    var k=keyOf(document.activeElement);
    renderParam();
    if(k){var el=document.querySelector("#parBox "+k);if(el){el.focus();if(el.select)el.select();}}
  },0);
}

/* ===================== escenarios ===================== */
function scenList(){try{return JSON.parse(localStorage.getItem(KEY+"-sc")||"[]");}catch(e){return [];}}
function scenSet(a){try{localStorage.setItem(KEY+"-sc",JSON.stringify(a));}catch(e){toast("No se pudo guardar en este navegador");}}
function scenListA(){return FS.dir?fsListarEsc():Promise.resolve(scenList());}
function scenGuardarA(rec){
  rec.autor=rec.autor||usuario();
  if(FS.dir)return fsGuardarEsc(rec);
  var a=scenList();a.unshift(rec);scenSet(a.slice(0,20));return Promise.resolve();
}
function scenBorrarA(rec){
  if(FS.dir)return fsBorrarEsc(rec);
  scenSet(scenList().filter(function(r){return r.id!==rec.id;}));return Promise.resolve();
}
function openScen(){
  var donde=FS.dir?'Se guardan en la carpeta compartida «'+esc(FS.dir.name)+'\\escenarios»: los ve todo el equipo.':'Se guardan en este navegador. Conectá la carpeta compartida para que los vea todo el equipo.';
  var html='<h3>Escenarios</h3><div style="color:var(--ink-soft);font-size:12px;margin-bottom:10px">Una foto completa de proyectos, fechas, recursos y parámetros. '+donde+' La base de comparación define los deltas de la franja de KPIs.</div>'
    +'<div class="row-actions"><input type="text" id="scName" placeholder="Nombre (ej. +2 eléctricos desde mar-27)" style="flex:1;min-width:0;border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--chip)" aria-label="Nombre del escenario">'
    +'<button class="btn primary" id="scSave">Guardar actual</button></div>'
    +'<div class="row-actions"><button class="btn sm" id="scBase">Usar el actual como base</button><button class="btn sm" id="scReset">Volver a los datos del archivo</button></div><div id="scList" style="margin-top:12px">Cargando…</div>';
  document.getElementById("dlgBody").innerHTML=html;openDlg(false);
  document.getElementById("scSave").onclick=function(){
    var n=document.getElementById("scName").value.trim()||("Escenario "+new Date().toLocaleDateString("es-AR"));
    scenGuardarA({id:Math.random().toString(36).slice(2,9),name:n,ts:Date.now(),datos:clone(S.datos)})
      .then(function(){openScen();toast("Escenario guardado");},function(e){toast("No se pudo guardar el escenario: "+(e&&e.message||e));});
  };
  document.getElementById("scBase").onclick=function(){S.base=clone(S.datos);S.baseNombre=S.nombre;recalc();render();save();toast("Base de comparación: "+S.nombre);};
  document.getElementById("scReset").onclick=function(){push();var w=nuevoWS();S.datos=w.datos;S.base=w.base;S.baseNombre="Base";S.nombre="Base";sel=null;recalc();render();save();toast("Datos del archivo restaurados · Ctrl+Z para deshacer");};

    if(!list.length){el.innerHTML='<div style="color:var(--ink-soft);font-size:13px">Todavía no hay escenarios guardados.</div>';return;}

function csv(rows){return rows.map(function(r){return r.map(function(c){var s=typeof c==="number"?String(Math.round(c*100)/100).replace(".",","):String(c==null?"":c);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(";");}).join("\n");}
function csvForecast(){
  /* misma forma que Forecast_Mes_V4 */
  var rows=[["Proyecto","Tipo Cliente","Componente","TipoCurva","Mes","Especialidad","Factor","HHComponente","HH Forecast","Fecha Forecast"]];
  R.filas.forEach(function(f){rows.push([f.proyecto,f.tipoCliente,f.componente,f.curva,f.mesCurva,f.especialidad,f.factor,f.hhComponente,f.hh,E.mesStr(f.mes)+"-01"]);});

}
function csvMatriz(){

  R.meses.forEach(function(m,i){rows.push([m].concat(R.demanda[i],R.capacidad[i],R.ocupacion[i].map(function(v){return v===Infinity?"inf":v;})));});
  return csv(rows);
}

/* ---- CSV exportado de la lista SharePoint DIM_Proyecto (mismo mapeo que backend/app/importar_csv.py) ---- */
function parseCSV(t){
  t=t.replace(/^\ufeff/,"");
  var sep=(t.split("\n")[0].split(";").length>t.split("\n")[0].split(",").length)?";":",";
  var rows=[],row=[],f="",q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===sep){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim()!=="";});});
}
function proyectosDesdeCSV(texto){
  var rows=parseCSV(texto),h=rows.shift().map(function(x){return x.trim();}),out=[],av=[];
  var col=function(r){var names=[].slice.call(arguments,1);for(var i=0;i<names.length;i++){var k=h.indexOf(names[i]);if(k>=0)return r[k];}return "";};
  var tx=function(v){v=(v||"").trim();return /^(|n\/a|na|-|none)$/i.test(v)?null:v;};
  var nm=function(v){v=tx(v);if(v===null)return null;if((v.match(/,/g)||[]).length===1&&v.indexOf(".")>=0)v=v.replace(/\./g,"");return +v.replace(",",".");};
  var mes=function(v){v=tx(v);if(!v)return null;var d=v.split(" ")[0];if(d.indexOf("/")>=0){var a=d.split("/");return a[2]+"-"+String(+a[1]).padStart(2,"0");}return d.slice(0,7);};
  var TEC={bess:"Bess",solar:"Solar","eólico":"Eólico",eolico:"Eólico",termico:"Termico","térmico":"Termico"};
  rows.forEach(function(r,i){
    var cod=tx(col(r,"Proyectos","Proyecto"));if(!cod)return;
    var tipo=tx(col(r,"Tipo Cliente")),est=tx(col(r,"Est Transformadora")),ln=tx(col(r,"Linea","Línea")),niv=tx(col(r,"Nivel DNN"));
    var tec=tx(col(r,"Tecnología","Tecnologia"));
    var p={id:i+1,proyecto:cod,nombre:tx(col(r,"Nombre")),tipoCliente:tipo,tecnologia:TEC[(tec||"").toLowerCase()]||tec,
      potencia:nm(col(r,"Potencia")),tamano:tx(col(r,"Tamaño")),
      nivelDNN:(tipo==="DNN"&&niv)?("DNN Cat"+niv.replace(/\D/g,"")):null,estado:tx(col(r,"Estado")),fechaInicio:mes(col(r,"Fecha Inicio")),
      est:est?(/nueva/i.test(est)?"ET Nueva":/ampl/i.test(est)?"Ampliación ET":est):null,
      linea:ln?(/\bAT$/i.test(ln)?"Línea AT":/\bMT$/i.test(ln)?"Línea MT":ln):null,
      simulable:!/^(si|sí|yes|true|1)$/i.test(tx(col(r,"Calendario Fijo"))||"no"),
      hhParque:null,hhEt:null,hhLinea:null,hhProy:null,factorSolapamiento:nm(col(r,"Factor Solapa","Factor Solapamiento"))||1,
      duracion:null,tensionPOE:nm(col(r,"Tensión POE")),avance:nm(col(r,"% Avance"))};
    if(["DPI","DNN","O&M"].indexOf(tipo)<0)av.push(cod+": Tipo Cliente desconocido ("+tipo+")");
    if(!p.fechaInicio)av.push(cod+": sin Fecha Inicio");
    if(tipo==="DNN"&&["DNN Cat1","DNN Cat2"].indexOf(p.nivelDNN)<0)av.push(cod+": DNN sin Nivel DNN válido");
    if(tipo==="O&M"&&niv)av.push(cod+": es O&M y tiene Nivel DNN «"+niv+"» (se ignora)");
    if(tipo!=="DPI"&&(p.est||p.linea))av.push(cod+": ET/Línea cargadas en un proyecto "+tipo+" (no se usan)");
    out.push(p);
  });
  return {proyectos:out,avisos:av};
}
function importar(file){
  var r=new FileReader();
  if(/\.csv$/i.test(file.name)){
    r.onload=function(){
      try{
        var res=proyectosDesdeCSV(r.result);
        if(!res.proyectos.length)throw 0;
        push();S.datos.proyectos=res.proyectos;sel=null;recalc();render();save();
        var tot=0;res.proyectos.forEach(function(p){tot+=totalP(p);});
        document.getElementById("dlgBody").innerHTML='<h3>Proyectos importados</h3><div class="psub" style="margin-bottom:10px">'+res.proyectos.length+' proyectos de «'+esc(file.name)+'» reemplazan la lista anterior ('+hh(tot)+' HH estimadas). Parámetros, curvas y recursos no cambian. Ctrl+Z deshace la importación.</div>'
          +(res.avisos.length?'<div class="holg crit">'+res.avisos.map(esc).join("<br>")+'</div>':'<div class="holg">Sin avisos.</div>')
          +'<div class="tablewrap"><table class="pk"><tr><th>Proyecto</th><th>Tipo</th><th>Tecnología</th><th class="r">MW</th><th>Tamaño</th><th>Inicio</th><th class="r">Solap.</th><th class="r">HH</th></tr>'
          +res.proyectos.map(function(p){return '<tr><td><b>'+esc(p.proyecto)+'</b> '+esc(p.nombre||"")+(p.simulable?'':' <span class="fl lock">fijo</span>')+'</td><td>'+esc(p.tipoCliente)+'</td><td>'+esc(p.tecnologia)+'</td><td class="calc">'+NF0.format(p.potencia||0)+'</td><td>'+E.tamano(p,S.datos.parametros)+'</td><td>'+mlabel(p.fechaInicio)+'</td><td class="calc">'+NF2.format(p.factorSolapamiento)+'</td><td class="calc">'+hh(totalP(p))+'</td></tr>';}).join("")
          +'</table></div>';
        openDlg(true);
      }catch(e){toast("No se pudo leer el CSV: revisá que tenga las columnas de DIM_Proyecto");}
    };
    r.readAsText(file,"utf-8");
    return;
  }
  r.onload=function(){
    try{
      var o=JSON.parse(r.result),d=o.datos||o;
      if(!d.proyectos||!d.curvas||!d.capacidad)throw 0;
      push();S.datos=d;S.nombre=o.escenario||file.name.replace(/\.json$/i,"");sel=null;recalc();render();save();
      toast("Escenario «"+S.nombre+"» importado");
    }catch(e){toast("Ese archivo no es un escenario válido");}
  };
  r.readAsText(file);
}

function toast(m){var el=document.getElementById("toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){el.classList.remove("on");},2400);}

document.addEventListener("keydown",function(e){

/* ===================== carpeta compartida (OneDrive / SharePoint sincronizado) ===================== */
/* La herramienta lee y escribe plan-capacidad.json en una carpeta local sincronizada.
   OneDrive la replica en SharePoint, así todo el equipo trabaja sobre el mismo plan.
   Cada guardado incrementa la revisión; si otro guardó antes, se avisa en lugar de pisar. */
var PLAN="plan-capacidad.json",HISTDIR="historial",ESCDIR="escenarios",HISTMAX=60,FS_INTERVALO=20000;
var FS={dir:null,pend:null,plan:null,ultimo:null,aviso:0,timer:null,ocupado:false,copias:[],sinPlan:false};
function fsSoportado(){return typeof window.showDirectoryPicker==="function";}
function usuario(){try{return localStorage.getItem(KEY+"-usuario")||"";}catch(e){return "";}}
function setUsuario(v){try{localStorage.setItem(KEY+"-usuario",v);}catch(e){}}
function fechaHora(iso){if(!iso)return "—";var d=new Date(iso);return d.toLocaleDateString("es-AR")+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});}
function slugTxt(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"x";}
function stamp(d){var z=function(n){return String(n).padStart(2,"0");};return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"-"+z(d.getHours())+z(d.getMinutes());}

/* IndexedDB: recuerda la carpeta elegida para no pedirla cada vez */
function idb(){return new Promise(function(ok,ko){var q=indexedDB.open("capacidad-ing",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv");};q.onsuccess=function(){ok(q.result);};q.onerror=function(){ko(q.error);};});}
function idbGet(k){return idb().then(function(db){return new Promise(function(ok,ko){var r=db.transaction("kv").objectStore("kv").get(k);r.onsuccess=function(){ok(r.result);};r.onerror=function(){ko(r.error);};});});}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(ok,ko){var t=db.transaction("kv","readwrite");if(v===undefined)t.objectStore("kv").delete(k);else t.objectStore("kv").put(v,k);t.oncomplete=function(){ok();};t.onerror=function(){ko(t.error);};});});}

function leerJSON(dir,nombre){
  return dir.getFileHandle(nombre).then(function(fh){return fh.getFile();}).then(function(f){return f.text();})
    .then(function(t){return JSON.parse(t.replace(/^﻿/,""));},function(e){if(e&&(e.name==="NotFoundError"||e.name==="TypeMismatchError"))return null;throw e;});
}
function escribirJSON(dir,nombre,obj){
  return dir.getFileHandle(nombre,{create:true}).then(function(fh){return fh.createWritable();})
    .then(function(w){return w.write(JSON.stringify(obj,null,1)).then(function(){return w.close();});});
}
function subdir(n){return FS.dir.getDirectoryHandle(n,{create:true});}
function listar(dir){
  var out=[],it=dir.values();
  function next(){return it.next().then(function(r){if(r.done)return out;out.push(r.value);return next();});}
  return next();
}
function permiso(h,pedir){
  if(!h.queryPermission)return Promise.resolve(true);
  var o={mode:"readwrite"};
  return h.queryPermission(o).then(function(st){
    if(st==="granted")return true;
    if(!pedir)return false;
    return h.requestPermission(o).then(function(s2){return s2==="granted";});
  });
}
function planValido(p){return p&&p.datos&&p.datos.proyectos&&p.datos.curvas&&p.datos.capacidad&&p.datos.parametros;}

/* ---- conexión ---- */
function fsConectar(){
  if(!fsSoportado()){openCarpeta();return;}
  window.showDirectoryPicker({id:"capacidad-ingenieria",mode:"readwrite"}).then(function(d){
    return permiso(d,true).then(function(ok){
      if(!ok)throw new Error("sin permiso de escritura");
      FS.dir=d;FS.pend=null;
      return idbSet("carpeta",d).catch(function(){});
    });
  }).then(function(){return fsAlConectar();}).then(function(){if(dlg.open&&document.getElementById("fsBox"))openCarpeta();})
    .catch(function(e){
      if(e&&e.name==="AbortError")return;
      if(e&&e.name==="SecurityError"){toast("Este entorno no permite usar carpetas: abrí el archivo capacidad-ingenieria.html desde la carpeta, con Edge o Chrome");return;}
      toast("No se pudo usar esa carpeta: "+(e&&e.message||e));
    });
}
function fsReconectar(){
  var h=FS.pend;if(!h){fsConectar();return;}
  permiso(h,true).then(function(ok){
    if(!ok){toast("Sin permiso para la carpeta «"+h.name+"»");return;}
    FS.dir=h;FS.pend=null;fsAlConectar();
  },function(){fsConectar();});
}
function fsRestaurar(){
  if(!fsSoportado()||!window.indexedDB)return;
  idbGet("carpeta").then(function(h){
    if(!h||!h.getFileHandle)return;
    return permiso(h,false).then(function(ok){if(ok){FS.dir=h;return fsAlConectar();}FS.pend=h;fsBarra();fsChip();});
  }).catch(function(){});
}
function fsDesconectar(){
  FS.dir=null;FS.pend=null;FS.plan=null;FS.ultimo=null;FS.copias=[];FS.sinPlan=false;clearInterval(FS.timer);
  idbSet("carpeta",undefined).catch(function(){});
  fsBarra();fsChip();toast("Carpeta desconectada: los cambios quedan solo en este navegador");
}
function fsMeta(p){return {revision:p.revision||0,guardadoPor:p.guardadoPor||"",guardadoEn:p.guardadoEn||""};}
function fsAlConectar(){
  fsChip();
  return leerJSON(FS.dir,PLAN).then(function(plan){
    FS.sinPlan=!plan;
    clearInterval(FS.timer);FS.timer=setInterval(fsRevisar,FS_INTERVALO);
    fsCopias();
    if(!plan){fsBarra();toast("La carpeta «"+FS.dir.name+"» todavía no tiene plan: usá «Guardar» para crearlo");return;}
    if(!planValido(plan)){toast(PLAN+" no tiene el formato esperado");return;}
    FS.ultimo=plan;FS.plan=fsMeta(plan);
    var mismaBase=S.fsCarpeta===FS.dir.name&&S.fsRev===plan.revision;
    if(mismaBase){fsBarra();fsChip();if(S.dirty)toast("Tenés cambios sin guardar sobre la revisión "+plan.revision);return;}
    if(!S.dirty){fsCargar(plan,"Plan vigente cargado · revisión "+plan.revision+(plan.guardadoPor?" de "+plan.guardadoPor:""));return;}
    fsConflicto(plan);
  });
}
function fsCargar(plan,msg){
  var selPrev=sel;
  push();
  S.datos=clone(plan.datos);S.base=clone(plan.datos);S.baseNombre="Plan vigente";S.nombre="Plan vigente";
  S.fsRev=plan.revision||0;S.fsCarpeta=FS.dir?FS.dir.name:"";S.dirty=false;
  FS.ultimo=plan;FS.plan=fsMeta(plan);FS.aviso=0;FS.sinPlan=false;
  sel=(selPrev&&selPrev.p&&!findP(selPrev.p))?null:selPrev;
  recalc();render();save();fsChip();fsBarra();
  if(msg)toast(msg);
}

/* ---- guardar ---- */
function fsGuardar(forzar){
  if(!FS.dir){if(FS.pend){fsReconectar();return Promise.resolve();}openCarpeta();return Promise.resolve();}
  if(FS.ocupado)return Promise.resolve();
  var u=usuario();
  if(!u){openCarpeta();toast("Escribí tu nombre: firma cada versión guardada");return Promise.resolve();}
  FS.ocupado=true;
  return leerJSON(FS.dir,PLAN).then(function(act){
    var revAct=act?(act.revision||0):0;
    if(act&&!forzar&&(revAct!==S.fsRev||S.fsCarpeta!==FS.dir.name)){FS.ocupado=false;fsConflicto(act);return;}
    var ahora=new Date(),rev=revAct+1;
    var plan={formato:"capacidad-ingenieria/plan",version:1,revision:rev,guardadoPor:u,guardadoEn:ahora.toISOString(),
      titulo:S.title||"",datos:S.datos};
    return escribirJSON(FS.dir,PLAN,plan).then(function(){
      return subdir(HISTDIR).then(function(h){
        return escribirJSON(h,"plan-r"+String(rev).padStart(4,"0")+"-"+stamp(ahora)+"-"+slugTxt(u)+".json",plan).then(function(){return podar(h);});
      }).catch(function(){});
    }).then(function(){
      S.fsRev=rev;S.fsCarpeta=FS.dir.name;S.dirty=false;S.base=clone(S.datos);S.baseNombre="Plan vigente";S.nombre="Plan vigente";
      FS.ultimo=plan;FS.plan=fsMeta(plan);FS.aviso=0;FS.sinPlan=false;
      recalc();render();save();fsChip();fsBarra();
      toast("Plan guardado en «"+FS.dir.name+"» · revisión "+rev);
    });
  }).catch(function(e){toast("No se pudo guardar en la carpeta: "+(e&&e.message||e));})
    .then(function(){FS.ocupado=false;});
}
function podar(h){
  return listar(h).then(function(es){
    var f=es.filter(function(e){return e.kind==="file"&&/^plan-r\d+.*\.json$/i.test(e.name);}).map(function(e){return e.name;}).sort();
    var sobran=f.slice(0,Math.max(0,f.length-HISTMAX));
    return Promise.all(sobran.map(function(n){return h.removeEntry(n).catch(function(){});}));
  });
}

/* ---- otro usuario guardó antes ---- */
function fsConflicto(plan){
  var mio=E.calcular(datosVista(S.datos)).kpis,suyo=E.calcular(datosVista(plan.datos)).kpis,quien=esc(plan.guardadoPor||"Otro usuario");

    +'<table class="pk"><tr><th>Versión</th><th class="r">Máx. ocup.</th><th class="r">HH excedidas</th><th>1.er crítico</th></tr>'+fila("La de "+quien,suyo)+fila("La tuya",mio)+'</table>'

      .then(function(){dlg.close();fsCargar(plan,"Tus cambios quedaron en Escenarios · plan de "+(plan.guardadoPor||"otro usuario")+" cargado");},
            function(e){toast("No se pudo guardar el escenario: "+(e&&e.message||e));});
  };

/* ---- vigilancia: OneDrive trae los cambios de otros; los mostramos solos ---- */
function fsRevisar(){
  if(!FS.dir||FS.ocupado||drag||document.visibilityState==="hidden")return;
  leerJSON(FS.dir,PLAN).then(function(plan){
    if(!planValido(plan)||plan.revision===S.fsRev&&S.fsCarpeta===FS.dir.name)return;
    FS.ultimo=plan;FS.plan=fsMeta(plan);FS.sinPlan=false;
    if(!S.dirty){fsCargar(plan,"Plan actualizado por "+(plan.guardadoPor||"otro usuario")+" · revisión "+plan.revision);return;}
    if(FS.aviso!==plan.revision){FS.aviso=plan.revision;fsBarra();fsChip();}
  }).catch(function(){});
  fsCopias();
}
function fsCopias(){
  if(!FS.dir)return;
  listar(FS.dir).then(function(es){
    var c=es.filter(function(e){return e.kind==="file"&&/^plan-capacidad.+\.json$/i.test(e.name)&&e.name!==PLAN;}).map(function(e){return e.name;});
    if(c.join("|")!==FS.copias.join("|")){FS.copias=c;fsBarra();}
  }).catch(function(){});
}

/* ---- indicadores ---- */
function fsChip(){
  var c=document.getElementById("fsChip");if(!c||!S)return;

  else if(FS.pend)t='Reconectar <b>'+esc(FS.pend.name)+'</b>';
  else t=S.dirty?'Solo en este navegador · <b>sin compartir</b>':'Sin carpeta compartida';
  c.innerHTML=t;c.className=(S.dirty&&(FS.dir||FS.pend))?"dirty":"";
  c.title=FS.plan&&FS.plan.guardadoPor?"Última versión: revisión "+FS.plan.revision+" de "+FS.plan.guardadoPor+" ("+fechaHora(FS.plan.guardadoEn)+")":"Carpeta compartida (OneDrive / SharePoint)";
  var g=document.getElementById("fsSave");if(g)g.textContent=S.dirty&&FS.dir?"Guardar •":"Guardar";
}
function fsBarra(){
  var b=document.getElementById("fsBar");if(!b)return;
  var h="",crit=false;
  if(FS.pend){h='La herramienta necesita permiso para volver a usar la carpeta <b>'+esc(FS.pend.name)+'</b>.<button class="btn sm" data-fs="reconectar">Permitir y cargar el plan</button>';}
  else if(FS.dir&&S.dirty&&FS.plan&&FS.plan.revision!==S.fsRev&&FS.ultimo){crit=true;h='<b>'+esc(FS.plan.guardadoPor||"Otro usuario")+'</b> guardó una versión nueva del plan ('+fechaHora(FS.plan.guardadoEn)+'). Tus cambios todavía no están guardados.<button class="btn sm" data-fs="conflicto">Ver opciones</button>';}
  else if(FS.dir&&FS.sinPlan){h='La carpeta <b>'+esc(FS.dir.name)+'</b> no tiene plan todavía.<button class="btn sm" data-fs="guardar">Crear el plan con los datos actuales</button>';}
  if(FS.dir&&FS.copias.length){crit=true;h+=(h?'<span class="sep"></span>':'')+'OneDrive creó copias en conflicto: '+FS.copias.map(esc).join(", ")+'.<button class="btn sm" data-fs="carpeta">Revisar</button>';}
  b.innerHTML=h;b.className=h?("on"+(crit?" crit":"")):"";
}
function wireFs(){
  document.getElementById("fsBar").onclick=function(e){
    var a=e.target.closest("[data-fs]");if(!a)return;
    var k=a.dataset.fs;
    if(k==="reconectar")fsReconectar();

/* ---- escenarios compartidos: un archivo por escenario en «escenarios» ---- */

  ge("fsUser").onchange=function(){setUsuario(this.value.trim());fsChip();toast("Nombre guardado");};
  if(ge("fsC"))ge("fsC").onclick=function(){setUsuario(ge("fsUser").value.trim());fsConectar();};
  if(ge("fsR"))ge("fsR").onclick=function(){setUsuario(ge("fsUser").value.trim());fsReconectar();};
  if(!FS.dir)return;
  ge("fsG").onclick=function(){setUsuario(ge("fsUser").value.trim());fsGuardar().then(function(){if(document.getElementById("fsBox"))openCarpeta();});};
  ge("fsL").onclick=function(){
    leerJSON(FS.dir,PLAN).then(function(p){
      if(!planValido(p)){toast("La carpeta no tiene un plan válido");return;}
      if(S.dirty&&p.revision===S.fsRev){fsCargar(p,"Plan vigente recargado · Ctrl+Z recupera tus cambios");dlg.close();return;}
      if(S.dirty){fsConflicto(p);return;}
      fsCargar(p,"Plan vigente recargado");dlg.close();
    });
  };
  ge("fsD").onclick=function(){fsDesconectar();openCarpeta();};
  subdir(HISTDIR).then(function(h){
    return listar(h).then(function(es){
      var f=es.filter(function(e){return e.kind==="file"&&/\.json$/i.test(e.name);}).map(function(e){return e.name;}).sort().reverse().slice(0,15);
      var box=ge("fsHist");if(!box)return;
      if(!f.length){box.textContent="Todavía no hay versiones guardadas.";return;}
      box.innerHTML='<table class="pk">'+f.map(function(n){
        var m=n.match(/^plan-r(\d+)-(\d{8})-(\d{4})-(.+)\.json$/i);
        var et=m?('Revisión '+(+m[1])+' · '+m[2].slice(6,8)+'/'+m[2].slice(4,6)+' '+m[3].slice(0,2)+':'+m[3].slice(2)+' · '+m[4].replace(/-/g," ")):n;
        return '<tr><td>'+esc(et)+'</td><td class="r"><button class="btn sm" data-hist="'+esc(n)+'" data-et="'+esc(m?"Revisión "+(+m[1]):n)+'">Abrir</button></td></tr>';
      }).join("")+'</table>';
      box.onclick=function(e){var b=e.target.closest("[data-hist]");if(b)fsAbrirVersion(h,b.dataset.hist,b.dataset.et);};
    });
  }).catch(function(){var b=ge("fsHist");if(b)b.textContent="No se pudo leer el historial.";});
  if(FS.copias.length){
    ge("fsCop").innerHTML='<h4>Copias en conflicto de OneDrive</h4><div class="psub">Aparecen cuando dos personas guardaron casi al mismo tiempo. Abrí cada una, compará y borrala cuando la hayas resuelto.</div><table class="pk">'
      +FS.copias.map(function(n){return '<tr><td>'+esc(n)+'</td><td class="r"><button class="btn sm" data-cop="'+esc(n)+'">Abrir</button> <button class="btn sm" data-copdel="'+esc(n)+'">Borrar</button></td></tr>';}).join("")+'</table>';
    ge("fsCop").onclick=function(e){
      var a=e.target.closest("[data-cop]"),d=e.target.closest("[data-copdel]");
      if(a)fsAbrirVersion(FS.dir,a.dataset.cop,a.dataset.cop);
      if(d)FS.dir.removeEntry(d.dataset.copdel).then(function(){FS.copias=FS.copias.filter(function(x){return x!==d.dataset.copdel;});fsBarra();openCarpeta();});
    };
  }
}

/* ===================== arranque ===================== */
function boot(){
  ed=document.getElementById("editor");dlg=document.getElementById("dlg");
  S=load();
  document.getElementById("title").value=S.title||"Plan de capacidad · Ingeniería";
  document.getElementById("zoom").value=S.cw;
  S.q="";
  recalc();render();
  wireDrag();wireClicks();wireDlgDrag();wireFs();fsChip();fsRestaurar();
  document.getElementById("dlgClose").onclick=function(){dlg.close();};
  document.getElementById("dlgX").onclick=function(){dlg.close();};
  document.getElementById("title").onchange=function(){S.title=this.value;save();};
  document.getElementById("undo").onclick=undo;
  document.getElementById("addBtn").onclick=function(){
    push();
    var ini=E.mesStr(Math.max(E.mesIdx(todayYM()),E.mesIdx(S.datos.horizonte.desde))+3);
    var p={id:nextId(),proyecto:"Nuevo proyecto",tipoCliente:"DPI",tecnologia:"Solar",potencia:100,nivelDNN:null,
      nombre:null,estado:"No Iniciado",fechaInicio:ini,tamano:null,est:"ET Nueva",linea:"Línea MT",simulable:true,hhParque:null,hhEt:null,hhLinea:null,hhProy:null,factorSolapamiento:1,duracion:null};
    S.datos.proyectos.push(p);sel={p:String(p.id)};recalc();render();save();
    var n=document.getElementById("edName");if(n){n.focus();n.select();}
  };
  document.getElementById("resBtn").onclick=openRecursos;
  document.getElementById("parBtn").onclick=openParametros;
  document.getElementById("minBtn").onclick=openNivelar;
  document.getElementById("scenBtn").onclick=openScen;
  document.getElementById("cmpBtn").onclick=openComparar;
  document.getElementById("pdfBtn").onclick=openPDF;
  document.getElementById("exportBtn").onclick=openExport;
  document.getElementById("importBtn").onclick=function(){document.getElementById("file").click();};
  document.getElementById("file").onchange=function(){if(this.files[0])importar(this.files[0]);this.value="";};
  document.getElementById("kbdBtn").onclick=openAtajos;
  document.getElementById("zoom").oninput=function(){S.cw=+this.value;render();save();};
  document.getElementById("theme").onclick=function(){
    var r=document.documentElement,c=r.getAttribute("data-theme");
    var dark=c?c==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme",dark?"light":"dark");
  };
  document.getElementById("buscarInp").oninput=function(){S.q=this.value.trim().toLowerCase();renderRows();};
  document.getElementById("buscarX").onclick=cerrarBuscar;
  document.getElementById("wrap").addEventListener("wheel",function(e){
    if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();zoom(S.cw+(e.deltaY<0?4:-4));
  },{passive:false});
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(d){downloads=d;}).catch(function(){});
  }
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
</body>
